<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Planificateur et minuteur de séance au poids du corps, sans matériel. Mode classique ou circuit, en français, anglais, espagnol, allemand ou italien. Aucun compte, aucun serveur : tout reste enregistré sur votre appareil."
    />
    <meta name="color-scheme" content="dark" />
    <title>Séance — reprise au poids du corps sans matériel</title>
    <link rel="canonical" href="https://kallly.github.io/SRCR/" />

    <!--
      Open Graph et JSON-LD : les bots de prévisualisation (Facebook, LinkedIn,
      Discord…) et la plupart des robots d'indexation ne lisent que le HTML
      statique de cette page, sans exécuter src/main.ts. Ces balises portent
      donc des valeurs fixes en français (langue source), indépendantes du
      contenu retraduit dynamiquement par l'app pour un visiteur reel.
      Voir CLAUDE.md, section « SEO & partage social ».
    -->
    <meta property="og:title" content="Séance — reprise au poids du corps sans matériel" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kallly.github.io/SRCR/" />
    <meta
      property="og:description"
      content="Planificateur et minuteur de séance au poids du corps, sans matériel. Mode classique ou circuit, en 5 langues, 100% local."
    />
    <meta property="og:site_name" content="Séance" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://kallly.github.io/SRCR/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Séance — reprise au poids du corps sans matériel" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Séance",
        "description": "Planificateur et minuteur de séance au poids du corps, sans matériel. Mode classique ou circuit, en 5 langues, 100% local.",
        "url": "https://kallly.github.io/SRCR/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Tout système avec navigateur web",
        "inLanguage": ["fr", "en", "es", "de", "it"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div class="titles">
          <p class="eyebrow" data-i18n="app.eyebrow">Phase 1 · sans matériel</p>
          <h1 data-i18n="app.heading">Ma séance</h1>
        </div>
        <div class="lang">
          <select id="locale" data-i18n-aria-label="lang.label"></select>
        </div>
      </header>
      <p class="tagline" data-i18n="app.tagline">
        Construis ton entraînement, ordonne les exercices, règle les pauses. Tout reste enregistré
        sur cet appareil.
      </p>
      <nav class="quicknav" aria-label="Sections">
        <a href="#section-plan" data-i18n="section.plan">Déroulé</a>
        <a href="#section-library" data-i18n="section.library">Bibliothèque</a>
      </nav>

      <div class="modes">
        <button id="modeClassic" type="button" data-i18n="mode.classic"></button>
        <button id="modeCircuit" type="button" data-i18n="mode.circuit"></button>
      </div>
      <p class="modehint" id="modeHint"></p>

      <div class="settings" id="settings">
        <div class="f">
          <label for="setPause" data-i18n="settings.pause"></label>
          <input type="number" id="setPause" min="10" max="300" step="10" />
        </div>
        <div class="f">
          <label for="setTrans" data-i18n="settings.transition"></label>
          <input type="number" id="setTrans" min="0" max="120" step="5" />
        </div>
      </div>

      <h2 id="section-plan" data-i18n="section.plan">Déroulé</h2>
      <ul class="plan" id="plan"></ul>
      <div class="empty" id="empty">
        <b data-i18n="empty.title"></b><span data-i18n="empty.body"></span>
      </div>

      <div class="preview" id="preview">
        <h3 data-i18n="preview.title"></h3>
        <p class="lead" id="previewLead"></p>
        <div class="seq" id="previewSeq"></div>
        <div class="pcount" id="previewCount"></div>
      </div>

      <p class="saved" id="saved" role="status"></p>

      <div class="rowbtns">
        <button class="ghost" type="button" id="addRest" data-i18n="actions.addRest"></button>
        <button class="ghost" type="button" id="addCustom" data-i18n="actions.addCustom"></button>
      </div>
      <div class="rowbtns">
        <button class="ghost" type="button" id="loadDefault" data-i18n="actions.loadDefault"></button>
        <button class="ghost" type="button" id="clearAll" data-i18n="actions.clearAll"></button>
      </div>

      <h2 id="section-library" data-i18n="section.library">Bibliothèque</h2>
      <div class="lib" id="library"></div>

      <p class="done" id="history"></p>
      <p class="credit">
        <a href="https://github.com/kallly/SRCR" target="_blank" rel="noopener" data-i18n="app.sourceCode"
          >Code source</a
        >
      </p>
    </div>

    <div class="bar">
      <div class="meta"><b id="barTitle"></b><span id="barSub"></span></div>
      <button class="go" type="button" id="start" disabled data-i18n="bar.start"></button>
    </div>

    <div class="run" id="run">
      <div class="rhead">
        <span id="runStep"></span>
        <button class="x" type="button" id="runQuit" data-i18n="runner.quit"></button>
      </div>
      <div class="prog"><i id="runProgress" style="width: 0"></i></div>
      <div class="rbody">
        <div class="rlabel" id="runLabel"></div>
        <div class="rname" id="runName"></div>
        <div class="rset" id="runSet"></div>
        <div class="rfig" id="runFigure"></div>
        <div class="ring" id="runRing">
          <svg viewBox="0 0 230 230" aria-hidden="true">
            <circle class="track" cx="115" cy="115" r="100" />
            <circle class="fill" id="runRingFill" cx="115" cy="115" r="100" />
          </svg>
          <div class="big" id="runTime" role="timer" aria-live="off"></div>
        </div>
        <div class="repsbig" id="runReps"></div>
        <div class="rhint" id="runHint"></div>
        <div class="rcue" id="runCue"></div>
        <div class="rnext" id="runNext"></div>
      </div>
      <div class="rfoot">
        <button type="button" id="runSecondary"></button>
        <button class="primary" type="button" id="runPrimary"></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
