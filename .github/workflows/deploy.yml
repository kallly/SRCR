name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois ; les pushes suivants annulent celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Le typecheck est le filet du projet : il verifie aussi que les cinq
      # langues exposent exactement les memes cles.
      - run: npm run typecheck

      - run: npm run build

      # Verifie ce que le build *produit* : texte francais present pour les
      # robots sans JS, cles d'exercice lisibles par une IA, JSON-LD
      # valide, exemple `?s=` de la page de spec reellement decodable, et
      # fiches non vides toutes inscrites au sitemap. Le typecheck
      # ci-dessus ne voit rien de tout cela.
      - run: npx tsx scripts/check-build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
