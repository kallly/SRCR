# Compilation de l'application mobile.
#
# Ce depot ne peut pas le faire tout seul : la machine de developpement est un
# Raspberry Pi sans JDK, sans SDK Android et — par construction — sans Xcode.
# Les runners GitHub ont les deux chaines preinstallees, et le depot etant
# public, les minutes sont gratuites sur `ubuntu-latest` comme sur
# `macos-latest` (ces derniers sont factures 10x sur un depot prive).
#
# Ce que chaque job prouve, exactement :
#
# - Android : un APK de debogage, publie en artefact. Il s'installe reellement
#   sur un telephone (sideload) — c'est le seul vrai test de bout en bout
#   disponible sans compte de magasin.
# - iOS : que le projet COMPILE, et rien de plus. Sans identite de signature il
#   n'y a ni .ipa, ni installation sur un appareil, ni TestFlight : tout cela
#   est derriere le compte developpeur Apple. Une compilation simulateur
#   attrape quand meme ce qui compte ici — un plugin mal synchronise, un
#   Package.swift casse, un Info.plist invalide.
#
# Ce job ne remplace pas `deploy.yml`, qui reste le filet de CI du site
# (typecheck + check-build sur `dist/`). Celui-ci ne regarde que `dist-app/`.
name: Compiler l'application mobile

on:
  push:
    branches: [portage-mobile, main]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # La CLI Capacitor refuse de demarrer en dessous de Node 22, la ou le reste
  # du depot tourne en 18 (machine de dev) et en 20 (deploy.yml). C'est la
  # seule raison de cet ecart : ne pas l'aligner sur les autres workflows.
  NODE_VERSION: 22

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # JDK 21 : l'image du runner en embarque plusieurs, et laisser le choix
      # au hasard du PATH est la meilleure facon d'avoir un build qui casse le
      # jour ou l'image change de defaut.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Le bundle embarque : ni publicite, ni analytique web, ni les 317 pages
      # generees. Le script echoue s'il en trouve (scripts/build-app.ts).
      - run: npm run build:app

      # `cap sync` RECOPIE le bundle dans le projet natif, il ne le lie pas :
      # sans cette etape l'APK contiendrait le bundle du dernier commit ou
      # quelqu'un a lance la commande a la main.
      - run: npx cap sync android

      # L'empreinte de signature declaree a Firebase doit etre celle de la cle
      # qui signe reellement l'APK. Si les deux divergent, RIEN ne casse a la
      # compilation : c'est la connexion Google qui echoue a l'execution, par
      # un DEVELOPER_ERROR (code 10) qui ne dit pas un mot de sa cause. C'est
      # exactement le genre de panne qu'on ne diagnostique qu'en sachant
      # d'avance ou regarder — d'ou cette verification, qui la transforme en
      # echec de build explicite.
      - name: Verifier les empreintes de signature declarees
        run: |
          declared=$(jq -r '.client[0].oauth_client[] | select(.client_type == 1) | .android_info.certificate_hash' \
            android/app/google-services.json | tr 'A-Z' 'a-z')
          actual=$(openssl pkcs12 -in android/debug.keystore -passin pass:android -nokeys -clcerts \
            | openssl x509 -noout -fingerprint -sha1 \
            | cut -d= -f2 | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$declared" ]; then
            echo "::error::google-services.json ne porte aucun client OAuth de type 1 : l'empreinte SHA-1 n'a pas ete enregistree dans la console Firebase. La connexion Google echouera par un DEVELOPER_ERROR."
            exit 1
          fi
          if [ "$declared" != "$actual" ]; then
            echo "::error::Empreinte declaree a Firebase ($declared) differente de celle de android/debug.keystore ($actual). La connexion Google echouera par un DEVELOPER_ERROR."
            exit 1
          fi
          echo "Empreinte SHA-1 concordante : $actual"

          # Meme piege, autre fichier : `public/.well-known/assetlinks.json`
          # declare l'empreinte SHA-256 qui autorise l'application a ouvrir les
          # liens cirkali.fr. Si elle ne correspond pas a la cle qui signe
          # l'APK, Android echoue la verification EN SILENCE et les liens
          # continuent d'ouvrir le navigateur — sans erreur nulle part.
          declared256=$(jq -r '.[] | select(.target.namespace == "android_app") | .target.sha256_cert_fingerprints[]' \
            public/.well-known/assetlinks.json | tr -d ':' | tr 'A-Z' 'a-z')
          actual256=$(openssl pkcs12 -in android/debug.keystore -passin pass:android -nokeys -clcerts \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-Z' 'a-z')
          if ! echo "$declared256" | grep -qx "$actual256"; then
            echo "::error::assetlinks.json ne declare pas l'empreinte SHA-256 de android/debug.keystore ($actual256). Les liens cirkali.fr continueront d'ouvrir le navigateur au lieu de l'application."
            exit 1
          fi
          echo "Empreinte SHA-256 presente dans assetlinks.json"

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: cirkali-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync ios

      # Capacitor 8 passe par Swift Package Manager et non plus CocoaPods :
      # pas d'etape `pod install`, mais une resolution de paquets explicite,
      # pour que son echec eventuel se lise ici plutot que noye dans le log de
      # compilation.
      - run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      # Informatif, et volontairement garde : le jour ou la cible change de
      # nom, cette ligne donne la reponse dans le log au lieu d'un « target
      # not found » sec.
      - run: xcodebuild -list -project ios/App/App.xcodeproj

      # `-scheme` et non `-target` : une cible ne construit pas les produits
      # Swift Package Manager, une action de build de schema si. Tant que le
      # projet n'avait qu'un paquet local trivial, `-target` suffisait ; il a
      # cesse de suffire des l'arrivee de Firebase et Google Sign-In. Le schema
      # est versionne (ios/App/App.xcodeproj/xcshareddata/), parce qu'Xcode ne
      # le cree qu'a la premiere ouverture du projet et le range dans
      # `xcuserdata/`, absent d'un runner.
      #
      # SDK simulateur et signature desactivee : compiler pour un appareil
      # reel exigerait un certificat et un profil de provisionnement, donc le
      # compte developpeur Apple. Ce n'est pas le but ici.
      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/xcodebuild.log

      # Un echec de xcodebuild ne laisse dans l'interface qu'un « exit code
      # 65 », et le journal complet n'est telechargeable qu'avec les droits
      # d'administration du depot. Les annotations, elles, sont publiques :
      # on y recopie les lignes d'erreur, pour que la cause se lise sans
      # ouvrir le journal.
      - name: Remonter les erreurs xcodebuild
        if: failure()
        run: |
          grep -E "(error:|fatal error|The following build commands failed)" /tmp/xcodebuild.log \
            | tail -20 \
            | while IFS= read -r line; do echo "::error::${line}"; done
